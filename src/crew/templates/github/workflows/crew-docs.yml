name: crew docs

on:
  pull_request:

# crew check-owns reads the PR and its unit's issue; a repo's default token may read only code.
permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv tool install git+https://github.com/itzTerra/agent-crew@v{version}
      - run: crew check-docs
      - run: crew check-owns ${{ github.event.pull_request.number }}
        env:
          GH_TOKEN: ${{ github.token }}
